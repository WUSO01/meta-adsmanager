name: Build and Release ZIP

on:
  push:
    tags:
      - 'v*' # Triggers when you push a tag starting with 'v' (e.g., v1.0.0)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Create ZIP archive from dist
        run: zip -r release-asset.zip dist

      # Step 3: Create and Upload to Release
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-asset.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
